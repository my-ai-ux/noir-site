<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOIR</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #080808;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }
    .badge {
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 16px;
      border: 1px solid #222;
      padding: 6px 14px;
      border-radius: 9999px;
    }
    h1 {
      font-size: clamp(3rem, 10vw, 6rem);
      font-weight: 800;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      margin-bottom: 16px;
      color: #fff;
    }
    p {
      color: #999;
      max-width: 460px;
      line-height: 1.6;
      font-size: 1rem;
      margin-bottom: 32px;
    }
    .btn {
      background: #ffffff;
      color: #000000;
      padding: 12px 28px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="badge">Coming Soon</div>
  <h1>NOIR</h1>
  <p>The new standard of minimalist design and technology. Under construction.</p>
  <a href="#" class="btn">Stay Updated</a>
</body>
</html>
